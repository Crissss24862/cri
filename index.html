<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CM Lashess</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff5f8;
      color: #333;
    }

    header {
      background: #ffffff;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #f3d5df;
    }

    header h1 {
      color: #d6336c;
      font-size: 32px;
    }

    header p {
      margin-top: 6px;
      color: #777;
    }

    .contenedor {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 25px;
    }

    .titulo h2 {
      color: #d6336c;
      margin-bottom: 8px;
    }

    .producto {
      background: white;
      border-radius: 18px;
      padding: 20px;
      max-width: 320px;
      margin: auto;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .foto {
      height: 230px;
      background: #fce4ec;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      margin-bottom: 18px;
    }

    .producto h3 {
      color: #333;
      font-size: 21px;
      margin-bottom: 10px;
    }

    .codigo {
      color: #999;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .precio {
      font-size: 25px;
      font-weight: bold;
      color: #d6336c;
      margin-bottom: 15px;
    }

    .mayorista {
      background: #fff0f5;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .stock {
      color: #218838;
      font-weight: bold;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 10px;
      background: #d6336c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #b92557;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding: 25px;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>CM Lashess</h1>
    <p>Realza tu mirada ✨</p>
  </header>

  <main class="contenedor">

    <div class="titulo">
      <h2>Nuestras pestañas</h2>
      <p>Compra tus pestañas favoritas</p>
    </div>

    <div class="producto">

      <div class="foto">
        👁️
      </div>

      <h3>Pestaña de prueba</h3>

      <div class="codigo">
        Código: CM001
      </div>

      <div class="precio">
        RD$550
      </div>

      <div class="mayorista">
        <strong>Precios por cantidad</strong><br>
        1 unidad: RD$550<br>
        3 unidades o más: RD$400 c/u<br>
        12 unidades o más: RD$350 c/u
      </div>

      <div class="stock">
        ✓ Disponible
      </div>

      <button>
        Pedir por WhatsApp
      </button>

    </div>

  </main>

  <footer>
    © 2026 CM Lashess by Cristal
  </footer>

</body>
</html>
